# Nginx as the load balancer in front of N API instances (FastAPI + Socket.IO on Uvicorn).
#
# Use this when self-hosting or scaling out on VMs/containers. On Render, the managed load balancer
# plays this role today (one instance), so this file is the documented equivalent, not live config.
# Design notes: docs/HLD.md §9.6.
#
# Each instance runs:  uvicorn app.main:asgi --host 0.0.0.0 --port 4000 --proxy-headers --forwarded-allow-ips='*'
# With more than one instance, Socket.IO also needs the Redis adapter (HLD §9.4) so a broadcast emitted
# on one instance reaches clients connected to the others.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # REST: stateless, so send each request to the least-busy instance.
    upstream api_rest {
        least_conn;
        server api1:4000 max_fails=3 fail_timeout=10s;
        server api2:4000 max_fails=3 fail_timeout=10s;
        server api3:4000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Socket.IO: the HTTP long-polling handshake and fallback must reach the same instance
    # (sticky sessions), so hash on the client address.
    upstream api_ws {
        ip_hash;
        server api1:4000 max_fails=3 fail_timeout=10s;
        server api2:4000 max_fails=3 fail_timeout=10s;
        server api3:4000 max_fails=3 fail_timeout=10s;
    }

    # WebSocket upgrade when the client asks for it; otherwise an empty Connection header,
    # which keeps upstream keep-alive connections working.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Rate limits (per client IP). Bids are the expensive, locked path, so they get the tighter limit.
    limit_req_zone $binary_remote_addr zone=bids:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name api.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Request bodies are small JSON documents.
        client_max_body_size 64k;

        # Set once here and inherited by every location (a location that declared its own
        # proxy_set_header would silently drop all of these).
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Live updates: long-lived WebSocket connections, no buffering.
        location /socket.io/ {
            proxy_pass http://api_ws;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        # Placing a bid: tight per-IP limit with a small burst for legitimate quick re-bids.
        location ~ ^/api/rfqs/[0-9]+/bids$ {
            limit_req zone=bids burst=10 nodelay;
            proxy_pass http://api_rest;
        }

        # Health checks from the platform or monitoring: no rate limit, no access log noise.
        location = /api/health {
            access_log off;
            proxy_pass http://api_rest;
        }

        # Everything else: REST API, Swagger UI (/docs), ReDoc and the OpenAPI spec.
        location / {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://api_rest;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
