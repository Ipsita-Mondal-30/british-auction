# Render Blueprint: Postgres + API. The frontend deploys separately on Vercel (see DEPLOY.md).
# Paid plans by default so the API doesn't sleep (sleeping drops WebSocket connections).
# Zero-cost demo: set both plans to `free` (the free database expires after 30 days).
databases:
  - name: british-auction-db
    databaseName: british_auction
    plan: basic-256mb

services:
  - type: web
    name: british-auction-api
    runtime: python
    rootDir: backend-py
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Migrations run at start so this works on every plan (preDeployCommand is paid-only).
    startCommand: alembic upgrade head && uvicorn app.main:asgi --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.15"
      - key: DATABASE_URL
        fromDatabase:
          name: british-auction-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false # your Vercel URL, e.g. https://british-auction.vercel.app (comma-separate several)
